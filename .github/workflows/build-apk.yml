name: Build Android APK (Sabzi Khata)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release & Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle Wrapper Executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk build-output/Sabzi-Khata-v1.4.apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk build-output/Sabzi-Khata-latest.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sabzi-Khata-v1.4-APK
          path: build-output/Sabzi-Khata-v1.4.apk
          if-no-files-found: error

      - name: Publish GitHub Release (if tag or dispatch)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-output/Sabzi-Khata-v1.4.apk
            build-output/Sabzi-Khata-latest.apk
          name: Sabzi Khata Release ${{ github.ref_name }}
          body: |
            ## Sabzi Khata (Hussain Foods) — ${{ github.ref_name }}
            - Fully upgraded with custom UI design system
            - On-the-fly Add Customer and Add Supplier in bill & purchase desks
            - Double-tap lock & bill saved success confirmation popup
            - 1-tap customer ledger bill detail & previous due calculation breakdown
            - Dedicated desk-based login (Sell, Buy, Boss)
          draft: false
          prerelease: false
